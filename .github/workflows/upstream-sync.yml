name: Upstream Sync

on:
  schedule:
    # Runs at 00:00 UTC every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream branch to check and sync from'
        required: true
        default: 'Dev'
        type: string
      target_branch:
        description: 'Target branch in this repository to merge into'
        required: true
        default: 'omarchy-fixes'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-sync:
    name: Check & Sync Upstream
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'Dev' }}
      TARGET_BRANCH: ${{ inputs.target_branch || 'omarchy-fixes' }}
      UPSTREAM_REPO: 'https://github.com/NuvioMedia/NuvioDesktop.git'

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || 'omarchy-fixes' }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and inspect changes
        id: check_upstream
        run: |
          git remote add upstream "${UPSTREAM_REPO}" || git remote set-url upstream "${UPSTREAM_REPO}"
          git fetch upstream "${UPSTREAM_BRANCH}"

          NEW_COMMITS_COUNT=$(git rev-list --count "${TARGET_BRANCH}..upstream/${UPSTREAM_BRANCH}")
          echo "Found ${NEW_COMMITS_COUNT} new commit(s) in upstream/${UPSTREAM_BRANCH}."

          # Check upstream latest release tag
          UPSTREAM_TAG=$(gh api repos/NuvioMedia/NuvioDesktop/releases/latest --jq .tag_name 2>/dev/null || echo "")
          CURRENT_VERSION=$(grep '^VERSION_NAME=' composeApp/Configuration/DesktopVersion.properties 2>/dev/null | cut -d'=' -f2 || echo "")

          VERSION_NEEDS_UPDATE=false
          if [ -n "${UPSTREAM_TAG}" ] && [ "${UPSTREAM_TAG}" != "${CURRENT_VERSION}" ]; then
            echo "Upstream release tag '${UPSTREAM_TAG}' differs from current '${CURRENT_VERSION}'."
            VERSION_NEEDS_UPDATE=true
          fi

          echo "count=${NEW_COMMITS_COUNT}" >> "$GITHUB_OUTPUT"
          echo "version_update=${VERSION_NEEDS_UPDATE}" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"

          if [ "${NEW_COMMITS_COUNT}" -gt 0 ]; then
            git log --oneline -n 25 "${TARGET_BRANCH}..upstream/${UPSTREAM_BRANCH}" > commit_summary.txt
          fi

      - name: Create Sync Branch and Open Pull Request
        if: steps.check_upstream.outputs.count > 0 || steps.check_upstream.outputs.version_update == 'true'
        run: |
          SYNC_BRANCH="sync/upstream-${UPSTREAM_BRANCH}-into-${TARGET_BRANCH}"
          
          # Branch from target_branch
          git checkout -B "${SYNC_BRANCH}" "${TARGET_BRANCH}"

          # Merge upstream changes without committing immediately
          if [ "${{ steps.check_upstream.outputs.count }}" -gt 0 ]; then
            git merge "upstream/${UPSTREAM_BRANCH}" --no-commit --no-ff || true
          fi

          # Replicate upstream release version if newer
          if [ "${{ steps.check_upstream.outputs.version_update }}" = "true" ] && [ -n "${{ steps.check_upstream.outputs.upstream_tag }}" ]; then
            TAG="${{ steps.check_upstream.outputs.upstream_tag }}"
            CODE=$(echo "${TAG}" | grep -o '[0-9]\+' | tail -n 1 || echo "1")
            cat << EOF > composeApp/Configuration/DesktopVersion.properties
VERSION_NAME=${TAG}
VERSION_CODE=${CODE}
EOF
            git add composeApp/Configuration/DesktopVersion.properties
          fi

          # Preserve fork's workflows to avoid GITHUB_TOKEN workflow push restrictions
          git checkout "${TARGET_BRANCH}" -- .github/workflows/

          # Check for unresolved merge conflicts outside .github/workflows
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved merge conflicts detected outside .github/workflows. Manual resolution required."
            git merge --abort || true
            exit 1
          fi

          # Finalize merge commit
          COMMIT_MSG="chore(sync): merge upstream/${UPSTREAM_BRANCH} into ${TARGET_BRANCH}"
          if [ "${{ steps.check_upstream.outputs.version_update }}" = "true" ]; then
            COMMIT_MSG="chore(sync): update desktop version to ${{ steps.check_upstream.outputs.upstream_tag }} and merge upstream/${UPSTREAM_BRANCH}"
          fi
          git commit -m "${COMMIT_MSG}" || true

          # Push sync branch to origin repository
          git push origin "${SYNC_BRANCH}" --force

          # Check if an existing open PR exists for this sync branch
          EXISTING_PR=$(gh pr list --head "${SYNC_BRANCH}" --base "${TARGET_BRANCH}" --state open --json number --jq '.[0].number')
          
          COMMIT_LOG=$(cat commit_summary.txt)
          PR_TITLE="chore(sync): merge upstream ${UPSTREAM_BRANCH} changes into ${TARGET_BRANCH}"
          PR_BODY=$(cat <<EOF
          ### Automated Upstream Sync
          
          This automated pull request incorporates **${{ steps.check_upstream.outputs.count }}** new commit(s) from \`${UPSTREAM_REPO}\` (\`${UPSTREAM_BRANCH}\`) into \`${TARGET_BRANCH}\`.
          
          #### Recent Upstream Commits:
          \`\`\`text
          ${COMMIT_LOG}
          \`\`\`
          
          ---
          *Review the changes and merge when ready.*
          EOF
          )

          if [ -n "${EXISTING_PR}" ]; then
            echo "Updating existing PR #${EXISTING_PR}..."
            gh pr edit "${EXISTING_PR}" --title "${PR_TITLE}" --body "${PR_BODY}"
          else
            echo "Creating new PR targeting ${TARGET_BRANCH}..."
            if ! gh pr create \
              --base "${TARGET_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --title "${PR_TITLE}" \
              --body "${PR_BODY}"; then
              echo "::warning::Could not create PR automatically via GITHUB_TOKEN."
              echo "To allow GitHub Actions to create PRs automatically: Go to Repo Settings -> Actions -> General -> Workflow permissions -> check 'Allow GitHub Actions to create and approve pull requests'."
              echo "The sync branch was successfully pushed! You can open the PR manually here: https://github.com/${GITHUB_REPOSITORY}/pull/new/${SYNC_BRANCH}"
            fi
          fi

      - name: Already Up to Date
        if: steps.check_upstream.outputs.count == 0
        run: |
          echo "Branch '${TARGET_BRANCH}' is already up-to-date with upstream/${UPSTREAM_BRANCH}."
